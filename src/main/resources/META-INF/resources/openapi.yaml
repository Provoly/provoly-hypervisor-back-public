        - name: place
          in: query
          description: Must match city or district value from equipment
          schema:
            type: array
            items:
              type: string
        - name: family
          in: query
          description: Must match family from equipment
          schema:
            type: array
            items:
              type: string
        - name: equipment
          in : query
          description: Must match equipment name to get anomalies count for this equipment
          schema:
            type: string
      responses:
        "401":
          description: Not Authorized
        "400":
          description: Invalid domain, date, status, or other filters
        "200":
          content:
            application/json:
              schema:
