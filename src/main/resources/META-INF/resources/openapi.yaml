        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                description: events id
            examples:
              default:
                summary: Associate Procedure model to events 1,2 and 3.
                value: [1,2,3]
      responses:
        "201":
          description: Procedure instance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureReadDto'
