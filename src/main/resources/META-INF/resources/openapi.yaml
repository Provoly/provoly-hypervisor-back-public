  /services/closed/{interval}:
    get:
      tags:
        - Metrics Controller
      summary: |
        Returns an aggregation of services
      description: |
        Aggregates the number of `DONE` services over a given interval and over a number of buckets from a given date.
      operationId: com.provoly.metrics.MetricsController_getTotalEquipmentsByEntity
      parameters:
        - name: interval
          description: must be one of `hour`,`day`,`week`,`month`,`quarter`,`year`
          in: path
          schema:
            type: string
          example: month
          required: true
        - name: date
          description: The timezoned reference date for building the aggregation over the last n intervals
          in: query
          schema:
            $ref: '#/components/schemas/DateTime'
          example: 2024-05-28T08:10:00Z
        - name: buckets
          description: Number of buckets. Default to `24`. Must be a positive number.
          in: query
          schema:
            type: integer
          example: 12
        - name: domain
          in: query
          schema:
            type: string
        - name: entity
          in : query
          schema:
            type: array
            items:
              type: string
        - name: family
          in: query
          schema:
            type: array
            items:
              type: string
        - name: place
          in: query
          description: Must match city or district value from equipment
          schema:
            type: array
            items:
              type: string
      responses:
        "401":
          description: Not Authorized
        "400":
          description: Invalid interval, entity, family code, or city/district
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedService'
              examples:
                default:
                  value: |
                    [
                      {
                        "start": "2023-05-01T00:00:00Z",
                        "count": 3
                      },
                      {
                        "start": "2024-01-01T00:00:00Z",
                        "count": 2
                      },
                      {
                        "start": "2024-03-01T00:00:00Z",
                        "count": 4
                      },
                      {
                        "start": "2024-05-01T00:00:00Z",
                        "count": 1
                      }
                    ]
      security:
        - oidc:
            - authenticated
