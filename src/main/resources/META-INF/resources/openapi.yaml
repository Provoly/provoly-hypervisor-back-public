  /services:
    post:
      tags:
        - Service Controller
      summary: Save or update services
      description: |
       `startDate` and `endDate` are required is `status` at least `ASKED` and
       `closeDate` is required if `status` is `DONE`
      operationId: com.provoly.equipment.ServiceController_saveOrUpdateServices
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ServiceWriteDto'
      responses:
        "204":
          description: No content
        "400":
          description: Equipment not exists
        "401":
          description: Not Authorized
        "403":
          description: | 
            - Forbidden
            - Missing a required property
      security:
        - oidc:
            - authenticated
    get:
      tags:
        - Service Controller
      summary: Retrieve all services
      operationId: com.provoly.equipment.ServiceController_getServices
      responses:
        "200":
          description: Returns services details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - authenticated
  /services/external/id/{actionId}:
    post:
      tags:
        - Service Controller
      summary: Create external service for an Asked Service Action
      description: |
        Generate External service and send it to external service application : Coswin. 
        It returns a service code which will be set in `serviceExternalId` property in action.
      operationId: com.provoly.equipment.ServiceController_createExternalService
      parameters:
        - name: actionId
          in: path
          schema:
            $ref: '#/components/schemas/UUID'
          example: 01ffde9d-30d2-4273-b61f-c6addd8747c8
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ExternalServiceWriteDto'
      responses:
        "204":
          description: No content
        "400":
          description: |
            - Action is not of type `ASKED_SERVICE`
            - Properties have invalid values
            - Equipment not exists
            - External application triggers an error
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden
            - Missing a required property
        "404":
          description: Action not found
      security:
        - oidc:
            - authenticated
  /servicesType:
    get:
      tags:
        - ServiceType Controller
      summary: Retrieve all service type. It's possible to filter on domain
      operationId: com.provoly.equipment.ServiceTypeController_getServiceTypes
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          example: EP
      responses:
        "200":
          description: Returns service types details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if page not specified
      security:
        - oidc:
            - authenticated
  /metrics/equipments-with-events/EP:
    get:
      tags:
        - Metrics Controller
      summary: Retrieve equipments from EP domain with event metrics
      description: |
        Returns the number of _Armoires_, _Foyers lumineux_ and unmanaged equipments linked with 
        at least one event that has not been closed, the number of services `ASKED` for this equipment, 
        and the number of services `IN_PROGRESS`.
        Filter on equipments without `deleted` property.
      operationId: com.provoly.metrics.MetricsController_getEpEquipmentWithEvent
      parameters:
        - name: entity
          in: query
          schema:
            type: array
            items:
              type: string
        - name: criticality
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Criticality'
        - name: category
          in: query
          schema:
            items:
              type: string
        - name: place
          in: query
          description: Must match city or district value from equipment
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          content:
            description: Returns Equipments with events
            application/json:
              schema:
                $ref: '#/components/schemas/EpEquipmentWithEventDto'
        "400":
          description: |
            - Entity/Criticality/Category not found
            - Place is not a valid City/District
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - authenticated
  /metrics/equipments-with-events/EP/detailed:
    get:
      tags:
        - Metrics Controller
      summary: Retrieve equipments from EP domain with event metrics
      description: |
        Similar to the endpoint `/metrics/equipments-with-events/EP` but the number of events is grouped by category and includes the "MANIFESTATION" category.
        Filter on equipments without `deleted` property.
      operationId: com.provoly.metrics.MetricsController_getEpEquipmentWithEventDetailed
      responses:
        "200":
