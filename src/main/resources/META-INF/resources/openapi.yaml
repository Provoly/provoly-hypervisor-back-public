  /services/external/id/{actionId}:
    post:
      tags:
        - Service Controller
      summary: Create external service for an Asked Service Action
      description: |
        Generate External service and send it to external service application : Coswin. 
        It returns a service code which will be set in `serviceExternalId` property in action.
      operationId: com.provoly.equipment.ServiceController_createExternalService
      parameters:
        - name: actionId
          in: path
          schema:
            $ref: '#/components/schemas/UUID'
          example: 01ffde9d-30d2-4273-b61f-c6addd8747c8
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ExternalServiceWriteDto'
            examples:
              default:
                summary: Create external service with equipment
                value: |
                  {
                    "name": "my external service",
                    "equipment": "e0b38641-3ff1-495e-b26c-2cb78f1d0c09",
                    "priority": "1-MINEUR",
                    "type": "Luminaire - Accidente menacant de tomber",
                    "description": "description"
                  }
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                invalidActionType:
                  description: Occurs when action is not of type `ASKED_SERVICE`
                invalidPropertyValue:
                  description: Occurs when `priority` or `type` have invalid values
                invalidEquipment:
                  description: Occurs when equipment not exist
                external:
                  description: Occurs when external application triggers an error
                  value: |
                    {
                        "code": 400,
                        "message": "Message from external application"
                    }
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if missing a required property
        "404":
          description: Action not found
      security:
        - oidc:
            - authenticated
