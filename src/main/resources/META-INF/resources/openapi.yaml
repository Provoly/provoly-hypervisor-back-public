        address:
          type: string
          example: "24 rue de Châlons"
        deleted:
          type: boolean
          default: false
          description: if true then the equipment will not be counted in the metrics and will not be returned
        level:
          type: integer
          description: Corresponds to the level to determine whether it will have a parent or not. If the value is 1, then it can be referenced in children equipments and will not itself have a parent equipment.
