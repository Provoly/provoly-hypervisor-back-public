            $ref: '#/components/schemas/DateTime'
          example: 2024-01-20T00:00:00Z
        - name: domain
          description: domain from equipment linked to event
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: event status
          schema:
            $ref: '#/components/schemas/Status'
        - name: entity
          in: query
          schema:
            type: array
            items:
              type: string
        - name: criticality
          in: query
          schema:
            type: array
            items:
