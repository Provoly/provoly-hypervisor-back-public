openapi: 3.0.3
info:
  title: Provoly Hypervisor API
  description: CRUD Operation on repositories data
  version: 1.0.0
servers:
  - url: http://provoly-hypervisor.com
paths:
  /events:
    get:
      tags:
        - Event Controller
      summary: Retrieve all events with pagination
      description: |
        Default sort on `status` (NEW,IN_PROGRESS,DONE), `criticality` (HIGH,MEDIUM,LOW) and `lastModificationDate` (reversed). It's possible to override it by sorting on other attributes.
        If order is no provided when sort, the default is asc.
        It's possible to filter on one or more criticalities, statuses, categories, sources, equipment entities or equipment families.
        It's possible to search on event id, event name or equipment name.
      operationId: com.provoly.event.EventController_getEvents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: 1
          required: true
          description: Page number requested, triggers an error if not specified or if 0.
        - name: pageSize
          in: query
          schema:
            type: integer
          example: 20
          description: Page size, returns an empty list if not specified.
        - name: creationDate
          in: query
          description: The date must be set to midnight. The filter will return all events created on that day.
          schema:
            type: string
            example: 2024-01-20T00:00:00Z
        - name: criticality
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Criticality'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Status'
        - name: category
          in: query
          schema:
            type: array
            items:
              type: string
        - name: entity
          in: query
          description: The equipment entity name. It must be known to the system.
          schema:
            type: array
            items:
              type: string
            example: [ 'CHALONS-COMMUN' ]
        - name: family
          in: query
          description: The equipment family code. It must be known to the system.
          schema:
            type: array
            items:
              type: string
            example: [ 'EP_O','EP_FL','EP_A' ]
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/EventSort'
        - name: order
          in: query
          schema:
            $ref: '#/components/schemas/SortOrder'
        - name: name
          in: query
          schema:
            type: string
          description: search on event name
          example: '00001'
        - name: id
          in: query
          schema:
            type: string
          description: search on event id
          example: '00001'
        - name: equipment
          in: query
          schema:
            type: string
          description: search on equipment name of event
          example: 'c-A'
      responses:
        "200":
          description: Return 2 events with `status` is `DONE` or `NEW` and `criticality` is `LOW` or `HIGH`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventReadDto'
              examples:
                default:
                  value: |
                    [
                      {
                        "id": 1,
                        "name": "Defaillance lampe",
                        "address": "112 Av. de Paris, 51000 Châlons-en-Champagne",
                        "description": "description",
                        "criticality": "LOW",
                        "status": "DONE",
                        "lastModificationDate": "2024-02-23T11:12:39.375184Z",
                        "creationDate": "2024-01-22T11:12:39.375184Z",
                        "equipment": {
                          "id": "12a64ae7-70ca-4d12-bcd9-9f1c75f23915",
                          "name": "C-1034",
                          "type": "Ouvrage",
                          "entity": "AGGLO-COMMUN"
                        },
                        "procedureId": 4,
                        "linkedEvents": 2,
                        "procedureProgress": 100,
                        "externalSourceRef": "citylinx_1",
                        "category": "OUTOFORDER",
                        "parent": {
                          "id": 1,
                          "name": "Tempête"
                        }
                      },
                      {
                        "id": 2,
                        "name": "Maintenance ouvrage2",
                        "address": "63 Rue de Fagnières, 51000 Châlons-en-Champagne",
                        "description": "description",
                        "criticality": "MEDIUM",
                        "status": "DONE",
                        "lastModificationDate": "2024-02-22T11:12:39.375184Z",
                        "creationDate": "2024-01-23T11:12:39.375184Z",
                        "equipment": null,
                        "procedureId": "4",
                        "linkedEvents": 2,
                        "procedureProgress": 100,
                        "externalSourceRef": "external_source3",
                        "category": "LIMIT"
                      },
                      {
                        "id": 3,
                        "name": "Festival Chalons",
                        "address": "28 E Rue du Général Fery, 51000 Châlons-en-Champagne",
                        "description": "description",
                        "criticality": "MEDIUM",
                        "status": "IN_PROGRESS",
                        "lastModificationDate": "2024-02-20T11:12:39.375184Z",
                        "creationDate": "2024-01-20T11:12:39.375184Z",
                        "equipment": null,
                        "procedureId": "3",
                        "linkedEvents": 1,
                        "procedureProgress": 0,
                        "category": "MANIFESTATION",
                        "startDate": "2008-01-02T23:00:00Z",
                        "endDate": "2008-01-03T23:00:00Z"
                      }
                    ]

        "401":
          description: Not Authorized
        "403":
          description: Forbidden if page not specified
      security:
        - oidc:
            - authenticated
    post:
      tags:
        - Event Controller
      summary: Save an Event
      description: |
        Events may come from the hypervisor, or from an external source. In this case, the `externalSourceRef` property must be filled in. 
        By default, the source is “Hypervisor”. 
        It's possible to set an `externalId`, in order to update event if already exists instead of save it (used for nodered flows). 
        `MANIFESTATION` category, `startDate` and `endDate` properties are necessary. `enDate` can't be before `startDate`.
        `ANOMALY` category requires sub categories.
      operationId: com.provoly.event.EventController_saveEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteDto'
            examples:
              default:
                summary: Create "outoforder" event
                value: |
                  {
                    "name":"event alert",
                    "description": "desc",
                    "address": "1 rue simone veil",
                    "criticality": "HIGH",
                    "category":"OUTOFORDER",
                    "equipmentId":"0c728960-d5fd-49ea-8fe8-f72cb9cfcccd",
                    "externalSourceRef": "source"
                  }
              event_with_subcategory:
                summary: Create "anomaly" event
                value: |
                  {
                    "name": "Traffic congestion anomaly",
                    "address": "14 rue de Chalons",
                    "description": "description",
                    "criticality": "MEDIUM",
                    "domain": "EP",
                    "category": "ANOMALY",
                    "subCategory":"TRAFFIC_CONGESTION",
                    "equipmentId": "f7eea8e4-bc10-4551-b866-94fb8ea2dc47"
                  }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReadDto'
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                invalidEquipment:
                  description: Occurs when equipmentId not exist
                  value: |
                    {
                        "code": 400,
                        "message": "Equipment with id '0c728960-d5fd-49ea-8fe8-f72cb9cfcccd' not exists"
                    }
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if missing a required property
      security:
        - oidc:
            - event_write
  /events/id/{id}:
    get:
      tags:
        - Event Controller
      summary: Retrieve event by id
      operationId: com.provoly.event.EventController_getEventDetails
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 21
          required: true
      responses:
        "200":
          description: Returns Event Details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReadDto'
              examples:
                default:
                  value: |
                    {
                      "id": 21,
                      "name": "Defaillance lampe",
                      "address": null,
                      "description": null,
                      "criticality": "LOW",
                      "status": "DONE",
                      "lastModificationDate": "2024-02-23T12:56:00.802501Z",
                      "creationDate": "2024-02-23T12:56:00.802501Z",
                      "category": "LIMIT",
                      "equipment": {
                        "id": "12a64ae7-70ca-4d12-bcd9-9f1c75f23915",
                        "name": "C-1034",
                        "type": "Ouvrage",
                        "entity": "Châlons Agglo"
                      },
                      "externalSourceRef": "citylinx_1"
                    }
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if page not specified
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_read
    put:
      tags:
        - Event Controller
      summary: Update an Event
      description: |
        It's possible to update any events, but events with an external source have non-modifiable properties:
        `category`, `subCategory`, `name` and `externalId`.
      operationId: com.provoly.event.EventController_updateEvent
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 1
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteDto'
            examples:
              default:
                summary: Update "limit" event
                value: |
                  {
                    "id": 1,
                    "name":"event report updated",
                    "description": "desc",
                    "address": "2 rue virgina woolf",
                    "criticality": "HIGH",
                    "category":"LIMIT",
                    "equipmentId":"0c728960-d5fd-49ea-8fe8-f72cb9cfcccd",
                    "externalSourceRef": "source"
                  }
      responses:
        "204":
          description: Updated
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                invalidEquipment:
                  description: Occurs when equipmentId not exist
                  value: |
                    {
                        "code": 400,
                        "message": "Equipment with id '0c728960-d5fd-49ea-8fe8-f72cb9cfcccd' not exists"
                    }
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if missing a required property
        "404":
          description: Event not Found
      security:
        - oidc:
            - event_write
  /events/id/{id}/close:
    put:
      tags:
        - Event Controller
      summary: Close event by id
      description: |
        Set status to DONE and update `closeDate` property. 
        Close date is not updated if event is already closed.
      operationId: com.provoly.event.EventController_closeEvent
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 22
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWriteDto'
            examples:
              default:
                summary: close event
                value: |
                  {
                    "id": "c3b9ead7-57a5-4dd4-a8bd-36da14bf1ac1",
                    "message":"Event is done"
                  }
      responses:
        "204":
          description: Updated
        "401":
          description: Not Authorized
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_write
  /events/id/{id}/comments:
    put:
      tags:
        - Event Controller
      summary: Save or update comment for an event
      description: Comment can be edited by its creator only. It's not possible to add or update a comment on a DONE event.
      operationId: com.provoly.event.EventController_saveOrUpdateCommentForEvent
      parameters:
        - name: id
          in: path
          description: event id
          schema:
            type: integer
          example: 22
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWriteDto'
            examples:
              default:
                summary: add new comment
                value: |
                  {
                    "id": "0c728960-d5fd-49ea-8fe8-f72cb9cfccca",
                    "message": "my comment",
                    "creator": "A.ThePower"
                  }
      responses:
        "204":
          description: Created or Updated
        "401":
          description: Not Authorized
        "403":
          description: Event is DONE or creator is not allowed
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_write
    get:
      tags:
        - Event Controller
      summary: Get all comments for an event
      operationId: com.provoly.event.EventController_getCommentsForEvent
      parameters:
        - name: id
          in: path
          description: event id
          schema:
            type: integer
          example: 22
          required: true
      responses:
        "200":
          description: Return 2 comments for event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentReadDto'
              examples:
                default:
                  value: |
                    [
                      {
                        "id": "d2915506-6ce7-47a1-9c05-7ae0de22dc09",
                        "creator": "A.ThePower",
                        "message": "my first comment message",
                        "lastModificationDate": "2024-08-02T11:00:00Z",
                        "creationDate": "2024-08-02T11:00:00Z"
                      },
                      {
                        "id": "5ecb7585-8aa0-4d88-a99b-32401d1db52c",
                        "creator": "B.Summers",
                        "message": "This comment is great",
                        "lastModificationDate": "2024-08-05T09:00:00Z",
                        "creationDate": "2024-09-04T10:00:00Z"
                      }
                    ]
        "401":
          description: Not Authorized
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_read
  /events/summary:
    get:
      tags:
        - Event Controller
      summary: Retrieve summary events grouped by status
      description: |
        Returns the last n summary events, sorted by last modification date and status. 
        It is possible to sort these summary events by criticality
      operationId: com.provoly.event.EventController_getEventSummaries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: 1
          required: true
          description: Limit of summary events by status. Default to 5.
        - name: criticality
          in: query
          schema:
            $ref: '#/components/schemas/Criticality'
          example: "HIGH"
          description: Filter on the criticality required
          required: false
      responses:
        "200":
          description: Return first summary event by status with a `MEDIUM` criticality
          content:
            application/json:
              schema:
                properties:
                  NEW:
                    $ref: '#/components/schemas/EventsSummariesByStatusDto'
                  IN_PROGRESS:
                    $ref: '#/components/schemas/EventsSummariesByStatusDto'
                  DONE:
                    $ref: '#/components/schemas/EventsSummariesByStatusDto'
              examples:
                default:
                  value: |
                    {
                      "IN_PROGRESS": {
                        "count": 2,
                        "events": [
                          {
                            "id": 34,
                            "name": "Festival Chalons",
                            "criticality": "MEDIUM",
                            "status": "IN_PROGRESS",
                            "lastModificationDate": "2024-02-20T10:37:33.792659Z",
                            "category": "MANIFESTATION",
                            "interventionRequestTitle": null,
                            "interventionRequestCount": 1,
                            "manifestation": {
                              "startDate": "2008-01-02T23:00:00Z",
                              "endDate": "2008-01-03T23:00:00Z"
                            }
                          }
                        ]
                      },
                      "DONE": {
                        "count": 1,
                        "events": []
                      },
                      "NEW": {
                        "count": 3,
                        "events": [
                          {
                            "id": 22,
                            "name": "Maintenance ouvrage2",
                            "criticality": "MEDIUM",
                            "status": "NEW",
                            "lastModificationDate": "2024-02-20T10:37:33.792659Z",
                            "category": "LIMIT",
                            "interventionRequestTitle": "intervention procedure_2",
                            "interventionRequestCount": 2,
                            "manifestation": {}
                          }
                        ]
                      }
                    }
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                invalidCriticality:
                  description: Occurs when Criticality filter is invalid
                  value: |
                    {
                        "code": 400,
                        "message": "No enum constant com.provoly.event.Criticality.toto"
                    }
                invalidLimit:
                  description: Occurs when limit query is invalid
                  value: |
                    {
                        "code": 400,
                        "message": "'limit' must be greater than 0"
                    }
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
          content:
            application/json:
              examples:
                invalidLimit:
                  description: Occurs when limit query is invalid
                  value: |
                    {
                        "code": 403,
                        "message": "'limit' must be greater than 0"
                    }
      security:
        - oidc:
            - authenticated
  /events/export:
    get:
      tags:
        - Event Controller
      summary: Export all events
      description: |
        Export events in a .xslx file.
        It's possible to export all events, even archived events if option is set to true. Default to false.
      operationId: com.provoly.event.EventController_getEventSummaries
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: Events are exported.
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - authenticated
  /procedures/model:
    get:
      tags:
        - Procedure Model Controller
      summary: Retrieve all procedures model with pagination
      description: |
        Default sort on `useCount` (reversed) and  `name`. It's possible to override it by sorting on other attributes.
        If order is no provided when sort, the default is asc.
        It's possible to filter on one or more domains, or search by name, creator or id by using `search` filter
      operationId: com.provoly.event.ProcedureModelController_getProceduresModel
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: 1
          required: true
          description: Page number requested, triggers an error if not specified or if 0.
        - name: pageSize
          in: query
          schema:
            type: integer
          example: 20
          description: Page size, returns an empty list if not specified.
        - name: search
          in: query
          description: Returns all procedures whose value is contained in the `name`, `creator` or `id` property
          schema:
            type: string
            example: proc
        - name: domain
          in: query
          description: The domain code. It must be known to the system.
          schema:
            type: array
            items:
              type: string
            example: [ 'EP' ]

        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureModelSort'
        - name: order
          in: query
          schema:
            $ref: '#/components/schemas/SortOrder'
      responses:
        "200":
          description: Return 2 procedures models with `domain` is `EP` and `name`, `creator` or `id``contains "laura"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcedureModelReadDto'
              examples:
                default:
                  value: |
                    [
                      {
                        "id": 1,
                        "name": "laura's procedure",
                        "description": "description",
                        "creationDate": "2024-06-20T07:39:35.555495Z",
                        "lastModificationDate": "2024-06-20T07:44:06.853084Z",
                        "creator": "eliott",
                        "domain": "EP",
                        "useCount": 4,
                        "actions": [
                          {
                            "id": "e9f9246d-7fef-4339-92f4-50335c9ca097",
                            "type": "OTHER",
                            "status": "NEW",
                            "lastModificationDate": "2024-06-28T06:16:36.421040Z",
                            "name": "other"
                          }
                        ]
                      },
                      {
                        "id": 2,
                        "name": "procedure model 4",
                        "description": "description",
                        "creationDate": "2024-06-20T07:39:35.555495Z",
                        "lastModificationDate": "2024-06-20T07:44:06.853084Z",
                        "creator": "laura",
                        "domain": "EP",
                        "useCount": 0,
                        "actions": [
                          {
                            "id": "e81eebe9-599c-41f9-bb70-bb4c34a3d744",
                            "type": "OTHER",
                            "status": "NEW",
                            "lastModificationDate": "2024-06-28T06:16:36.426601Z",
                            "name": "other2"
                          }
                        ]
                      }
                    ]

        "401":
          description: Not Authorized
        "403":
          description: Forbidden if page not specified
      security:
        - oidc:
            - proc_model_read
    post:
      tags:
        - Procedure Model Controller
      summary: Save a procedure model
      description: |
        Save a procedure model and it's actions. Default actions types are `EMAIL`, `PHONE`, `SMS`, `ASKED_SERVICE` and `OTHER`.
        It's possible to insert custom action types that will not have specific properties.
      operationId: com.provoly.event.ProcedureModelController_saveProcedureModel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureModelWriteDto'
            examples:
              default:
                summary: Save procedure model
                value: |
                  {
                    "name": "model de procedure test",
                    "description": "description",
                    "creator": "billie",
                    "domain": "EP",
                    "actions": [
                      {
                        "id": "f3a43a98-1d86-4ba5-84a8-7c3462786f63",
                        "type": "EMAIL",
                        "name": "toto",
                        "email": "toto"
                      },
                      {
                        "id": "28c017db-cb9a-4cc1-a1a4-f9be0a88dc94",
                        "type": "CSU"
                      },
                      {
                        "id": "e9f9246d-7fef-4339-92f4-50335c9ca097",
                        "type": "OTHER",
                        "name": "other action"
                      },
                      {
                        "id": "5977b943-7612-46a2-a983-ac32785e9a84",
                        "type": "PHONE",
                        "name": "tutu",
                        "phone": "0102030405"
                      },
                      {
                        "id": "31de7845-4cce-4d2a-b001-84f534efcace",
                        "type": "SMS",
                        "name": "titi",
                        "phone": "0102030405"
                      }
                    ]
                  }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureModelWriteDto'
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                invalidName:
                  description: Occurs when name already exists
                  value: |
                    {
                        "code": 400,
                        "message": "Event with name 'event alert' already exists"
                    }
                invalidEquipment:
                  description: Occurs when equipmentId not exist
                  value: |
                    {
                        "code": 400,
                        "message": "Equipment with id '0c728960-d5fd-49ea-8fe8-f72cb9cfcccd' not exists"
                    }
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if missing a required property
      security:
        - oidc:
            - proc_model_write
  /procedures/model/id/{id}:
    get:
      tags:
        - Procedure Model Controller
      summary: Retrieve procedure model by id
      operationId: com.provoly.procedure.ProcedureModelController_getProcedureDetails
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 29
          required: true
      responses:
        "401":
          description: Not Authorized
        "403":
          description: Forbidden if page not specified
        "404":
          description: Procedure Model Not found
        "200":
          description: Returns procedure model Details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureModelReadDto'
              examples:
                default:
                  value: |
                    {
                      "id": 29,
                      "name": "procedure model 4",
                      "description": "description",
                      "creationDate": "2024-06-20T07:39:35.555495Z",
                      "lastModificationDate": "2024-06-20T07:44:06.853084Z",
                      "creator": "Jean Dupont",
                      "domain": "VP",
                      "useCount": 0,
                      "actions": [
                        {
                          "id": "5977b943-7612-46a2-a983-ac32785e9a84",
                          "type": "PHONE",
                          "status": "DONE",
