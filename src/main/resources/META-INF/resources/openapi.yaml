openapi: 3.0.3
info:
  title: Provoly Hypervisor API
  description: CRUD Operation on repositories data
  version: 1.0.0
servers:
  - url: http://provoly-hypervisor.com
paths:
  /events:
    get:
      tags:
        - Event Controller
      summary: Retrieve all events with pagination
      description: |
        Default sort on `status` (NEW,IN_PROGRESS,DONE), `criticality` (HIGH,MEDIUM,LOW) and `lastModificationDate` (reversed). It's possible to override it by sorting on other attributes.
        If order is no provided when sort, the default is asc.
        It's possible to filter on one or more criticalities, statuses, categories, sources, equipment entities or equipment families.
        It's possible to search on event id, event name or equipment name.
      operationId: com.provoly.event.EventController_getEvents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: 1
          description: Page number requested, default to 1. Trigger an error if not specified or if 0.
        - name: pageSize
          in: query
          schema:
            type: integer
          example: 20
          description: Page size, default to 20. Return an empty list if not specified.
        - name: creationDate
          in: query
          description: The date must be set to midnight. The filter will return all events created on that day.
          schema:
            type: string
            example: 2024-01-20T00:00:00Z
        - name: closeDate
          in: query
          description: Filter on closed events where closeDate is greater or equal than `closeDate` in query
          schema:
            type: string
            example: 2024-01-20T10:09:00Z
        - name: criticality
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Criticality'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Status'
        - name: category
          in: query
          schema:
            type: array
            items:
              type: string
            example: [ 'LIMIT' ]
          description: Event category code. It must be known to the system
        - name: entity
          in: query
          description: The equipment entity name. It must be known to the system.
          schema:
            type: array
            items:
              type: string
            example: [ 'CHALONS-COMMUN' ]
        - name: family
          in: query
          description: The equipment family code. It must be known to the system.
          schema:
            type: array
            items:
              type: string
            example: [ 'EP_ARMOIRE','VP_CAM' ]
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/EventSort'
        - name: order
          in: query
          schema:
            $ref: '#/components/schemas/SortOrder'
        - name: name
          in: query
          schema:
            type: string
          description: search on event name
          example: '00001'
        - name: id
          in: query
          schema:
            type: string
          description: search on event id
          example: '00001'
        - name: equipment
          in: query
          schema:
            type: string
          description: search on equipment name of event
          example: 'c-A'
      responses:
        "200":
          description: Return 2 events with `status` is `DONE` or `NEW` and `criticality` is `LOW` or `HIGH`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEventDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - authenticated
    post:
      tags:
        - Event Controller
      summary: Save an event
      description: |
        Events may come from the Hypervisor (internal event), or from an external source (external event). 
        Internal events must have a `creator`, and it's source is automatically 'Hyperviseur'.
        External events must have an `externalSourceRef`.
        by default, InternalEventWriteDto is deserialized. If creator and externalSourceRef are presents, then the source is ignored, 
        and if none of these properties are present, then an error is raised, saying that the creator is missing.
        It's possible to set an `externalId` for external events, in order to update event if already exists instead of save it (used for nodered flows). 
        `MANIFESTATION` category, `startDate` and `endDate` properties are necessary. `endDate` can't be before `startDate`.
         `ANOMALY` category requires sub categories.
      operationId: com.provoly.event.EventController_saveEvent
      requestBody:
        content:
          application/json:
            schema:
              OneOf:
                - $ref: '#/components/schemas/ExternalEventWriteDto'
                - $ref: '#/components/schemas/InternalEventWriteDto'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReadDto'
        "400":
          description: Equipment not exists
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Missing a required property
      security:
        - oidc:
            - event_write
  /events/id/{id}:
    get:
      tags:
        - Event Controller
      summary: Retrieve event by id
      operationId: com.provoly.event.EventController_getEventDetails
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 21
          required: true
      responses:
        "200":
          description: Return event Details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_read
    put:
      tags:
        - Event Controller
      summary: Update an event
      description: |
        It's possible to update any events, but events with an external source have non-modifiable properties:
        `category`, `subCategory`, `name` and `externalId`.
      operationId: com.provoly.event.EventController_updateEvent
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 1
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteDto'
      responses:
        "204":
          description: Updated
        "400":
          description: Equipment not exsts
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Missing a required property
            - External source can't be updated
        "404":
          description: Event not Found
      security:
        - oidc:
            - event_write
  /events/{source}/id/{id}:
    get:
      tags:
        - Event Controller
      summary: Retrieve event by it's source and external id
      operationId: com.provoly.event.EventController_getEventDetailsBySourceAndExternalId
      parameters:
        - name: source
          in: path
          schema:
            type: string
          example: Citylinx
          required: true
        - name: id
          in: path
          schema:
            type: string
          example: 21ad9
          required: true
      responses:
        "200":
          description: Returns Event Details by it's source and external id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_read
    put:
      tags:
        - Event Controller
      summary: Update an Event
      description: |
        It's possible to update any events, but events with an external source have non-modifiable properties:
        `category`, `subCategory`, `name` and `externalId`.
      operationId: com.provoly.event.EventController_updateEvent
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 1
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteDto'
      responses:
        "204":
          description: Updated
        "400":
          description: Equipment not exists
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Missing a required property
        "404":
          description: Event not Found
      security:
        - oidc:
            - event_write
  /events/id/{id}/close:
    put:
      tags:
        - Event Controller
      summary: Close event by id
      description: |
        Set status to DONE and update `closeDate` property. 
        Close date is not updated if event is already closed.
      operationId: com.provoly.event.EventController_closeEvent
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 22
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWriteDto'
      responses:
        "204":
          description: Updated
        "401":
          description: Not Authorized
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_write
  /events/id/{id}/comments:
    put:
      tags:
        - Event Controller
      summary: Save or update comment for an event
      description: Comment can be edited by its creator only. It's not possible to add or update a comment on a DONE event.
      operationId: com.provoly.event.EventController_saveOrUpdateCommentForEvent
      parameters:
        - name: id
          in: path
          description: event id
          schema:
            type: integer
          example: 22
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWriteDto'
      responses:
        "204":
          description: Created or Updated
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Event is DONE or creator is not allowed
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_write
    get:
      tags:
        - Event Controller
      summary: Get all comments for an event
      operationId: com.provoly.event.EventController_getCommentsForEvent
      parameters:
        - name: id
          in: path
          description: event id
          schema:
            type: integer
          example: 22
          required: true
      responses:
        "200":
          description: Return 2 comments for event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_read
  /events/summary:
    get:
      tags:
        - Event Controller
      summary: Retrieve summary events grouped by status
      description: |
        Returns the last n summary events, sorted by last modification date and status. 
        It is possible to sort these summary events by criticality
      operationId: com.provoly.event.EventController_getEventSummaries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: 1
          required: true
          description: Limit of summary events by status. Default to 5.
        - name: criticality
          in: query
          schema:
            $ref: '#/components/schemas/Criticality'
          example: "HIGH"
          description: Filter on the criticality required
          required: false
      responses:
        "200":
          description: Return first summary event by status with a `MEDIUM` criticality
          content:
            application/json:
              schema:
                properties:
                  NEW:
                    $ref: '#/components/schemas/EventsSummariesByStatusDto'
                  IN_PROGRESS:
                    $ref: '#/components/schemas/EventsSummariesByStatusDto'
                  DONE:
                    $ref: '#/components/schemas/EventsSummariesByStatusDto'
        "400":
          description: Criticality invalid
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Limit invalid
      security:
        - oidc:
            - authenticated
  /events/export:
    get:
      tags:
        - Event Controller
      summary: Export all events
      description: |
        Export events in a .xslx file.
        It's possible to export all events, even archived events if option is set to true. Default to false.
      operationId: com.provoly.event.EventController_getEventSummaries
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: Events are exported.
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - authenticated
  /procedures/model:
    get:
      tags:
        - Procedure Model Controller
      summary: Retrieve all procedures model with pagination
      description: |
        Default sort on `useCount` (reversed) and  `name`. It's possible to override it by sorting on other attributes.
        If order is no provided when sort, the default is asc.
        It's possible to filter on one or more domains, or search by name, creator or id by using `search` filter
      operationId: com.provoly.event.ProcedureModelController_getProceduresModel
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: 1
          description: Page number requested, default to 1. Trigger an error if not specified or if 0.
        - name: pageSize
          in: query
          schema:
            type: integer
          example: 20
          description: Page size, default to 20. Return an empty list if not specified.
        - name: search
          in: query
          description: Returns all procedures whose value is contained in the `name`, `creator` or `id` property
          schema:
            type: string
            example: proc
        - name: domain
          in: query
          description: The domain code. It must be known to the system.
          schema:
            type: array
            items:
              type: string
            example: [ 'EP' ]
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureModelSort'
        - name: order
          in: query
          schema:
            $ref: '#/components/schemas/SortOrder'
      responses:
        "200":
          description: Return 2 procedures models with `domain` is `EP` and `name`, `creator` or `id``contains "laura"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcedureModelReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - proc_model_read
    post:
      tags:
        - Procedure Model Controller
      summary: Save a procedure model
      description: |
        Save a procedure model and it's actions. Default actions types are `EMAIL`, `PHONE`, `SMS`, `ASKED_SERVICE` and `OTHER`.
        It's possible to insert custom action types that will not have specific properties.
      operationId: com.provoly.event.ProcedureModelController_saveProcedureModel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureModelWriteDto'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureModelWriteDto'
        "400":
          description: Name already exists or equipment id not exists
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Missing a required property
      security:
        - oidc:
            - proc_model_write
  /procedures/model/id/{id}:
    get:
      tags:
        - Procedure Model Controller
      summary: Retrieve procedure model by id
      operationId: com.provoly.procedure.ProcedureModelController_getProcedureDetails
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 29
          required: true
      responses:
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Procedure Model Not found
        "200":
          description: Returns procedure model Details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureModelReadDto'
      security:
        - oidc:
            - proc_model_read
    put:
      tags:
        - Procedure Model Controller
      summary: Update procedure model
      description: It's possible to update every properties, even actions order. But `creator` must be the same.
      operationId: com.provoly.procedure.ProcedureModelController_updateProcedureModel
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 3
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureModelWriteDto'
      responses:
        "204":
          description: Updated
        "400":
          description: |
            - Invalid domain/action type 
            - Name already exists 
            - Action id already exists 
            - `creator` must be unchanged
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - proc_model_write
  /procedures/model/id/{id}/associate:
    put:
      tags:
        - Procedure Model Controller
      summary: Associate procedure model to one or more events
      description: |
        The procedure model association will generate a new Procedure instance. 
        This procedure is linked to events whose ids are in request body.
        These events will automatically be set to `IN_PROGRESS` status.
      operationId: com.provoly.procedure.ProcedureModelController_associateProcedureModeltoEvents
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 3
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                description: events id
            examples:
              default:
                summary: Associate Procedure model to events 1,2 and 3.
                value: [1,2,3]
      responses:
        "201":
          description: Procedure instance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureReadDto'
        "400":
          description: At least one event id not exists
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - At least one event is already associated to a procedure, or closed.
        "404":
          description: Procedure model not found
      security:
        - oidc:
            - event_write
  /procedures/id/{id}:
    get:
      tags:
        - Procedure Controller
      summary: Retrieve procedure by id
      description: Return procedure detail and its linked events.
      operationId: com.provoly.procedure.ProcedureController_getProcedureDetails
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 45
          required: true
      responses:
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Procedure Not found
        "200":
          description: Returns procedure Details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureReadDto'
      security:
        - oidc:
            - event_read
    put:
      tags:
        - Procedure Controller
      summary: Update events and actions procedure
      operationId: com.provoly.procedure.ProcedureController_updateProcedure
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 3
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureWriteDto'
      responses:
        "204":
          description: Updated
        "400":
          description: Bad Request
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - event_proc_write
            - event_write
    delete:
      tags:
        - Procedure Controller
      summary: Delete procedure by id
      description: |
        Events can again be associated with a procedure model. Status events are reset to `NEW`.
      operationId: com.provoly.procedure.ProcedureController_deleteProcedure
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 45
          required: true
      responses:
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Procedure Not found
        "204":
          description: Procedure deleted
      security:
        - oidc:
            - event_write
  /procedures/id/{id}/close:
    put:
      tags:
        - Procedure Controller
      summary: Close all procedure events by id
      description: Set status to DONE. Close date is not updated if event is already closed
      operationId: com.provoly.procedure.ProcedureController_closeAllProcedureEvents
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 50
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWriteDto'
      responses:
        "204":
          description: Updated
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Event Not found
      security:
        - oidc:
            - event_write
  /procedures/id/{id}/associate/event/id/{eventId}:
    put:
      tags:
        - Procedure Controller
      summary: Add new event to procedure
      description: |
        Add new event to an already instantiated procedure. 
        Event must have `NEW` status, and procedure can't be done;
      operationId: com.provoly.procedure.ProcedureController_addEventToProcedure
      parameters:
        - name: id
          in: path
          schema:
            type: integer
          example: 50
          required: true
        - name: eventId
          in: path
          schema:
            type: integer
          example: 50
          required: true
      responses:
        "204":
          description: Updated
        "400":
          description: Event is done or procedure is done
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Event Not found or Procedure not Found
      security:
        - oidc:
            - event_write
  /actions/id/{id}/comments:
    put:
      tags:
        - Action Controller
      summary: Save or update comment for an action
      description: Comment can be edited by its creator only. It's not possible to add or update a comment on a DONE procedure.
      operationId: com.provoly.event.ActionController_saveOrUpdateCommentForAction
      parameters:
        - name: id
          in: path
          description: action id
          schema:
            type: string
          example: 30956c82-073f-4b51-8f79-b447ebe54c76
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWriteDto'
      responses:
        "204":
          description: Created or Updated
        "401":
          description: Not Authorized
        "403":
          description: | 
            - Forbidden
            - Procedure of this action is DONE or creator is not allowed
        "404":
          description: Action Not found
      security:
        - oidc:
            - event_proc_comment_write
    get:
      tags:
        - Action Controller
      summary: Get all comments for an action
      operationId: com.provoly.event.ActionController_getCommentsForAction
      parameters:
        - name: id
          in: path
          description: action id
          schema:
            type: string
          example: 30956c82-073f-4b51-8f79-b447ebe54c76
          required: true
      responses:
        "200":
          description: Return 2 comments for action
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Action Not found
      security:
        - oidc:
            - event_read
  /equipments:
    post:
      tags:
        - Equipment Controller
      summary: Save or update equipments
      description: If one of external id entry exists, update equipment, else create it
      operationId: com.provoly.equipment.EquipmentController_saveOrUpdateEquipments
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EquipmentWriteDto'
      responses:
        "204":
          description: No content
        "400":
          description: Name already exists or equipment not exists
        "401":
          description: Not Authorized
        "403":
          description: |
            - Forbidden 
            - Missing a required property
      security:
        - oidc:
            - authenticated
    get:
      tags:
        - Equipment Controller
      summary: Retrieve all equipments with pagination
      description: |
        Returns all equipments without `deleted` property.
        It's possible to filter on entity, or search by equipment name or family name.
      operationId: com.provoly.equipment.EquipmentController_getEquipments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: 1
          description: Page number requested, default to 1. Trigger an error if not specified or if 0.
        - name: pageSize
          in: query
          schema:
            type: integer
          example: 20
          description: Page size, default to 20. Return an empty list if not specified.
        - name: entity
          in: query
          schema:
            type: array
            items:
             type: string
          description: must match one of `EquipmentEntity` name
          example: 'FAGNIERES-COMMUN'
        - name: search
          in: query
          schema:
            type: string
          description: search on equipment code and family name
          example: 'armo'
      responses:
        "200":
          description: Returns equipments details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
      security:
        - oidc:
            - authenticated
  /equipments/id/{id}:
    get:
      tags:
        - Equipment Controller
      summary: Retrieve an equipment by id
      operationId: com.provoly.equipment.EquipmentController_getEquipmentsDetails
      parameters:
        - name: id
          in: path
          schema:
            $ref: '#/components/schemas/UUID'
          example: 01ffde9d-30d2-4273-b61f-c6addd8747c8
          required: true
      responses:
        "200":
          description: Returns equipment Details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentReadDto'
        "401":
          description: Not Authorized
        "403":
          description: Forbidden
        "404":
          description: Equipment Not found
      security:
        - oidc:
            - authenticated
  /equipments/name/{name}:
    get:
      tags:
        - Equipment Controller
      summary: Retrieve an equipment by name
      operationId: com.provoly.equipment.EquipmentController_getEquipmentsDetails
      parameters:
        - name: name
          in: path
          schema:
            type: string
          example: P-1000
          required: true
      responses:
        "200":
          description: Returns equipment Details by name
          content:
