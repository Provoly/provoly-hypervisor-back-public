      summary: |
        Count open events grouped by anomaly's subcategories
      description: |
        It's possible to filter on event creation date, event status. If creation date is set, then ignore Done events.
        If a domain filter is set, count all events linked to a equipment with this domain.
        Filter on equipments without `deleted` property.
      operationId: com.provoly.metrics.MetricsController_getAnomalyEventsGroupedBySubCategories
