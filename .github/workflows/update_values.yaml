name: "Update ArgoCD values."

on:
  workflow_run:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.adoc'
      - 'docs'
      - 'ide-config'
      - '*.txt'
      - '.github/**'
    workflows: [Build]
    branches:
      - main
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build
    runs-on: provoly-runner
    steps:
      - uses: actions/checkout@v4
      - name: Sets env vars for main branch
        run: |
          echo CI_SHORT_COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-8) >> $GITHUB_ENV

      - name: Update values on chalons-dev (v2)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_DISPATCH_TOKEN }}
          repository: provoly/provoly-chart-values
          event-type: update-chart-value
          client-payload: |
            {
              "filename": "chalons/chalons-dev/provoly/values.yaml",
              "field_names": "provolyHypervisorBackendImagetag",
              "field_value": "dev-${{ env.CI_SHORT_COMMIT_SHA }}"
            }
        if: ${{ github.event.workflow_run.head_branch == 'main' }}

      - name: Update values on chalons-int (v1)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_DISPATCH_TOKEN }}
          repository: provoly/provoly-chart-values
          event-type: update-chart-value
          client-payload: |
            {
              "filename": "chalons/chalons-int/provoly/values.yaml",
              "field_names": "provolyHypervisorBackendImagetag",
              "field_value": "dev-${{ env.CI_SHORT_COMMIT_SHA }}"
            }
        if: ${{ github.event.workflow_run.head_branch == 'v1' }}
