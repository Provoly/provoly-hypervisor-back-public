name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "v1"
  pull_request:

env:
  JAVA_VERSION: 21
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showDateTime=true -Djansi.force=true"
  MAVEN_CLI_OPTS: "-Dstyle.color=always --batch-mode --errors --show-version -DinstallAtEnd=true -Dno-format -DdeployAtEnd=true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_job:
    name: Preparing path-ignores
    runs-on: provoly-runner
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          paths_ignore: '[".gitignore","LICENSE","*.adoc","*.txt","docs/**", "ide-config", ".github/**"]'
          do_not_skip: '["workflow_dispatch"]'
          skip_after_successful_duplicate: false
  build:
    name: Build
    runs-on: provoly-runner
    steps:
      - uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.1

      - name: Sets env vars for main branch
        run: |
          export CI_SHORT_COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-8) >> $GITHUB_ENV
          export "DOCKER_IMAGE_ADDITIONAL_TAGS=dev-$CI_SHORT_COMMIT_SHA,latest" >> $GITHUB_ENV
          echo "MAVEN_CLI_OPTS=-Dstyle.color=always --batch-mode --errors --show-version -DinstallAtEnd=true -DdeployAtEnd=true -Dquarkus.container-image.additional-tags=$DOCKER_IMAGE_ADDITIONAL_TAGS -Dquarkus.container-image.labels.\"git-ref\"=$CI_SHORT_COMMIT_SHA -DskipTests" >> $GITHUB_ENV
          echo "MAVEN_PROFILE=-Pdocker-image" >> $GITHUB_ENV
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: provoly-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            provoly-maven-

      - name: Build with Maven
        run: mvn ${{ env.MAVEN_CLI_OPTS }} verify ${{ env.MAVEN_PROFILE }}
        env:
          CI_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          CI_REGISTRY_SERVER: ${{ vars.REGISTRY_URL }}
          CI_REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
