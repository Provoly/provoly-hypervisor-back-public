extends:
  - recommended
apis:
  provoly-hypervisor-back:
    root: ./src/main/resources/META-INF/openapi.yaml
    rules:
      no-ambiguous-paths:
        severity: off
      operation-4xx-response: off
theme:
  schemaExpansionLevel: 2
  generateCodeSamples:
    languages:
      - lang: curl
      - lang: Java
  typography:
    links:
      textDecoration: '#0090cc'
    fontFamily:
      - Ubuntu
      - sans-serif
    fontSize: 1rem
    lineHeight: 1.25rem
    font-weight: 400
    font-style: normal
    